name: Build BUDDY Android Mobile APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK (Java 21, Gradle 8.11.1, SDK 36)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: "Set up Android SDK 36 (api-level: 36)"
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME=/usr/local/lib/android/sdk
          fi
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

          SDKMANAGER=$(which sdkmanager 2>/dev/null || find "$ANDROID_HOME/cmdline-tools" -name "sdkmanager" -type f 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Error: sdkmanager executable not found in $ANDROID_HOME"
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          SDK_DIR=$(dirname "$SDKMANAGER")
          echo "$SDK_DIR" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/36.0.0" >> $GITHUB_PATH

          echo "Accepting licenses..."
          yes | "$SDKMANAGER" --licenses || true

          echo "Installing Android SDK 36 packages..."
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Validate TypeScript & Automated Tests
        run: |
          npm run lint
          npm test

      - name: Check Release Signing Secret Configuration
        id: signing_check
        env:
          HAS_KEYSTORE: ${{ secrets.BUDDY_KEYSTORE_BASE64 != '' }}
          HAS_KEYSTORE_PASSWORD: ${{ secrets.BUDDY_KEYSTORE_PASSWORD != '' }}
          HAS_KEY_ALIAS: ${{ secrets.BUDDY_KEY_ALIAS != '' }}
          HAS_KEY_PASSWORD: ${{ secrets.BUDDY_KEY_PASSWORD != '' }}
        run: |
          if [ "$HAS_KEYSTORE" = "true" ] && [ "$HAS_KEYSTORE_PASSWORD" = "true" ] && [ "$HAS_KEY_ALIAS" = "true" ] && [ "$HAS_KEY_PASSWORD" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "All required Android release signing secrets are configured."
          elif [ "$HAS_KEYSTORE" = "true" ] || [ "$HAS_KEYSTORE_PASSWORD" = "true" ] || [ "$HAS_KEY_ALIAS" = "true" ] || [ "$HAS_KEY_PASSWORD" = "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            missing=""
            [ "$HAS_KEYSTORE" != "true" ] && missing="${missing} BUDDY_KEYSTORE_BASE64"
            [ "$HAS_KEYSTORE_PASSWORD" != "true" ] && missing="${missing} BUDDY_KEYSTORE_PASSWORD"
            [ "$HAS_KEY_ALIAS" != "true" ] && missing="${missing} BUDDY_KEY_ALIAS"
            [ "$HAS_KEY_PASSWORD" != "true" ] && missing="${missing} BUDDY_KEY_PASSWORD"
            echo "::warning::Partial Android release signing secrets detected (missing:${missing}). Skipping signed release APK build; debug APK will still be built."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Android release signing secrets are not configured. Skipping signed release APK build."
          fi

      - name: Validate Production Environment & Build Web Application
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL }}
          RELEASE_SIGNING_READY: ${{ steps.signing_check.outputs.ready }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -n "$VITE_API_BASE_URL" ]; then
            if echo "$VITE_API_BASE_URL" | grep -qiE "ais-dev-|ais-pre-"; then
              echo "::error::VITE_API_BASE_URL points to an authenticated AI Studio preview host which rejects Android APK requests. Configure an independent public Cloud Run HTTPS backend URL."
              exit 1
            fi
            if ! echo "$VITE_API_BASE_URL" | grep -qE "^https://[^[:space:]@]+"; then
              echo "::error::VITE_API_BASE_URL must be a valid public HTTPS service root URL without embedded credentials."
              exit 1
            fi
            echo "Embedding validated production VITE_API_BASE_URL into web & Android assets."
          else
            if [ "$RELEASE_SIGNING_READY" = "true" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::VITE_API_BASE_URL is required for public release Android APK builds. Deploy the BUDDY backend and set repository variable VITE_API_BASE_URL."
              exit 1
            fi
            echo "::warning::VITE_API_BASE_URL is not configured. Debug APK will report Server Unavailable for cloud Gemini (On-Device Offline AI remains functional). Signed release builds require VITE_API_BASE_URL."
          fi

          npm run build

          if grep -rnE "AIza[0-9A-Za-z_-]{20,}|https?://ais-(dev|pre)-[a-z0-9]+|SURYA_API_TOKEN|VERONICA_SECRET" dist/; then
            echo "::error::Forbidden API key, server secret, or AI Studio preview host detected in built dist/ assets!"
            exit 1
          fi

      - name: Copy Built Web Assets & Verify Bundle Secrecy
        run: |
          set -euo pipefail
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          if grep -rnE "AIza[0-9A-Za-z_-]{20,}|https?://ais-(dev|pre)-[a-z0-9]+|SURYA_API_TOKEN|VERONICA_SECRET" android/app/src/main/assets/public/; then
            echo "::error::Forbidden API key, server secret, or preview URL detected in Android APK web assets!"
            exit 1
          fi

      - name: Set up Gradle 8.11.1 Wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.11.1 --distribution-type bin || true
          chmod +x gradlew || true

      - name: Run Android Lint & Build Debug APK
        working-directory: android
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew lintDebug assembleDebug --no-daemon --console=plain --stacktrace
          else
            gradle lintDebug assembleDebug --no-daemon --console=plain --stacktrace
          fi

      - name: Print Android Lint Report on Failure
        if: failure()
        run: |
          for report in android/app/build/reports/lint-results-debug.txt android/app/build/reports/lint-results-release.txt; do
            if [ -f "$report" ]; then
              echo "=== $report ==="
              cat "$report"
            fi
          done

      - name: Build Signed Release APK & Verify Signature
        if: steps.signing_check.outputs.ready == 'true'
        working-directory: android
        env:
          BUDDY_KEYSTORE_BASE64: ${{ secrets.BUDDY_KEYSTORE_BASE64 }}
          BUDDY_KEYSTORE_PASSWORD: ${{ secrets.BUDDY_KEYSTORE_PASSWORD }}
          BUDDY_KEY_ALIAS: ${{ secrets.BUDDY_KEY_ALIAS }}
          BUDDY_KEY_PASSWORD: ${{ secrets.BUDDY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_TMP="$(mktemp "${RUNNER_TEMP:-/tmp}/buddy-release-XXXXXX.jks")"
          cleanup() {
            rm -f "$KEYSTORE_TMP"
          }
          trap cleanup EXIT

          chmod 600 "$KEYSTORE_TMP"
          printf '%s' "$BUDDY_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_TMP"
          if [ ! -s "$KEYSTORE_TMP" ]; then
            echo "::error::Decoded release keystore file is empty."
            exit 1
          fi

          export BUDDY_KEYSTORE_PATH="$KEYSTORE_TMP"
          if [ -f "./gradlew" ]; then
            ./gradlew lintRelease assembleRelease --no-daemon --console=plain --stacktrace
          else
            gradle lintRelease assembleRelease --no-daemon --console=plain --stacktrace
          fi

          RELEASE_APK="$(find app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)"
          if [ -z "$RELEASE_APK" ] || [ ! -f "$RELEASE_APK" ]; then
            echo "::error::Release APK output was not generated."
            exit 1
          fi
          APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$RELEASE_APK"

      - name: Package APKs & Generate SHA-256 Checksums
        run: |
          set -euo pipefail
          mkdir -p artifacts/debug artifacts/release

          find android/app/build/outputs/apk/debug -name "*.apk" -type f | sort | while read -r apk; do
            echo "Found Debug APK: $apk"
            cp "$apk" artifacts/debug/BUDDY-Android-debug.apk
            (cd artifacts/debug && sha256sum BUDDY-Android-debug.apk > BUDDY-Android-debug.apk.sha256)
            cat artifacts/debug/BUDDY-Android-debug.apk.sha256
          done

          if [ "${{ steps.signing_check.outputs.ready }}" = "true" ]; then
            find android/app/build/outputs/apk/release -name "*.apk" -type f | sort | while read -r apk; do
              echo "Found Signed Release APK: $apk"
              cp "$apk" artifacts/release/Surya-Android.apk
              (cd artifacts/release && sha256sum Surya-Android.apk > Surya-Android.apk.sha256)
              cat artifacts/release/Surya-Android.apk.sha256
            done
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BUDDY-Debug-APK
          path: artifacts/debug/*
          if-no-files-found: warn

      - name: Upload Signed Release APK Artifact
        if: steps.signing_check.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Surya-Android.apk
          path: artifacts/release/*
          if-no-files-found: error

      - name: Upload Android Lint & Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BUDDY-Android-Reports
          path: |
            android/app/build/reports/lint-results-*.txt
            android/app/build/reports/lint-results-*.html
          if-no-files-found: ignore
